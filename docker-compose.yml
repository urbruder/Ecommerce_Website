services:

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    ports:
      - "4000:4000"

    env_file:
      - ./backend/.env

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    ports:
      - "5173:80"

    depends_on:
      - backend

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile

    ports:
      - "5174:80"

    depends_on:
      - backend